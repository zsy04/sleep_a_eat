<svg viewBox="0 0 680 470" width="100%" xmlns="http://www.w3.org/2000/svg">
<title>subagent 深度限制（maxDepth）机制</title>
<desc>顶层 agent 深度 0，每委托一层 +1；深度同时写入运行时选项和持久化 header，读取取最大值防恢复逃逸；超过 maxDepth 时抛错拒绝。</desc>
<defs>
<marker id="arrowd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="40" y="40" font-family="system-ui, sans-serif" font-size="15" font-weight="500" fill="#2C2C2A">subagent 深度限制：递归预算 + 防逃逸</text>
<g>
<rect x="220" y="56" width="240" height="52" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="76" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">顶层 agent</text>
<text x="340" y="94" font-family="system-ui, sans-serif" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">depth = 0</text>
</g>
<path d="M340 108 L340 132" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrowd)"/>
<text x="360" y="122" font-family="system-ui, sans-serif" font-size="11" fill="#5F5E5A">委托（depth + 1）</text>
<g>
<rect x="220" y="134" width="240" height="52" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="154" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">子 agent</text>
<text x="340" y="172" font-family="system-ui, sans-serif" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">depth = 1</text>
</g>
<path d="M340 186 L340 210" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrowd)"/>
<g>
<rect x="220" y="212" width="240" height="52" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="232" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">孙 agent</text>
<text x="340" y="250" font-family="system-ui, sans-serif" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">depth = 2　← maxDepth = 2，允许到此</text>
</g>
<path d="M340 264 L340 288" fill="none" stroke="#E24B4A" stroke-width="1.5" marker-end="url(#arrowd)"/>
<g>
<rect x="220" y="290" width="240" height="52" rx="10" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="340" y="310" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#791F1F" text-anchor="middle" dominant-baseline="central">曾孙 agent（被拒）</text>
<text x="340" y="328" font-family="system-ui, sans-serif" font-size="12" fill="#A32D2D" text-anchor="middle" dominant-baseline="central">depth = 3 → 抛 SubagentDepthError</text>
</g>
<g>
<rect x="60" y="372" width="560" height="78" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="76" y="392" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#2C2C2A" dominant-baseline="central">深度同时写两个载体，读取取最大值（防恢复逃逸）</text>
<text x="76" y="414" font-family="Consolas, monospace" font-size="12" fill="#5F5E5A" dominant-baseline="central">options.subagentDepth（运行时）  +  header.delegationDepth（持久化）</text>
<text x="76" y="434" font-family="Consolas, monospace" font-size="12" fill="#0F6E56" dominant-baseline="central">delegationDepthOf = Math.max(header ?? 0, runtime ?? 0)　→　只能加深，永不降低</text>
</g>
</svg>
