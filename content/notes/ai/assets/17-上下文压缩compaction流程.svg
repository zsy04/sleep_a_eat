<svg viewBox="0 0 680 560" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8b8b8b"/>
    </marker>
  </defs>

  <text x="24" y="34" font-size="20" font-weight="700" fill="#1a1a1a">compaction 上下文压缩：四阶段</text>
  <text x="24" y="56" font-size="13" fill="#666">把较早一段历史压成结构化摘要，替换原文，腾出上下文空间</text>

  <rect x="40" y="80" width="600" height="64" rx="10" fill="#eef4ff" stroke="#4a7cf0" stroke-width="1.5"/>
  <text x="56" y="104" font-size="14" font-weight="700" fill="#2f5fd0">① 触发</text>
  <text x="56" y="124" font-size="12" fill="#555">pressure（压力）/ context-overflow（溢出）/ 手动命令 → compactIfNeeded / compactNow</text>

  <path d="M 340 144 L 340 164" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <rect x="40" y="168" width="600" height="64" rx="10" fill="#fff7e6" stroke="#e0a030" stroke-width="1.5"/>
  <text x="56" y="192" font-size="14" font-weight="700" fill="#b07900">② 选范围 selectCompactableRange</text>
  <text x="56" y="212" font-size="12" fill="#555">从头部选一段可压缩范围，保留最近尾巴（retainTokens），边界必须"工具配对平衡"</text>

  <path d="M 340 232 L 340 252" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <rect x="40" y="256" width="600" height="64" rx="10" fill="#ffe9e9" stroke="#d04a4a" stroke-width="1.5"/>
  <text x="56" y="280" font-size="14" font-weight="700" fill="#b02a2a">③ 摘要 summarizeWithLlm</text>
  <text x="56" y="300" font-size="12" fill="#555">LLM 把历史压成结构化 checkpoint（8 个 section），指令放最后复用 KV cache</text>

  <path d="M 340 320 L 340 340" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <rect x="40" y="344" width="600" height="64" rx="10" fill="#eaffea" stroke="#38a83c" stroke-width="1.5"/>
  <text x="56" y="368" font-size="14" font-weight="700" fill="#1f7a22">④ 替换（shadow）</text>
  <text x="56" y="388" font-size="12" fill="#555">历史被一个 user/message 替换，带 &lt;compacted-summary&gt; 标签 + checkpoint 标记</text>

  <line x1="40" y1="430" x2="640" y2="430" stroke="#ddd" stroke-width="1"/>

  <text x="24" y="456" font-size="14" font-weight="700" fill="#1a1a1a">关键：surface（模型可见）vs log（完整记录）</text>

  <rect x="40" y="472" width="280" height="70" rx="8" fill="#f6f6f6" stroke="#ddd"/>
  <text x="52" y="494" font-size="12" font-weight="700" fill="#333">surface（模型看到的）</text>
  <text x="52" y="512" font-size="11" fill="#555">[摘要 user/message] + 未压缩尾部</text>
  <text x="52" y="528" font-size="11" fill="#555">旧的流水账被摘要替换掉了</text>

  <rect x="360" y="472" width="280" height="70" rx="8" fill="#f6f6f6" stroke="#ddd"/>
  <text x="372" y="494" font-size="12" font-weight="700" fill="#333">log（完整记录）</text>
  <text x="372" y="512" font-size="11" fill="#555">compaction/start + summary + end</text>
  <text x="372" y="528" font-size="11" fill="#555">+ shadowedSeqs（被替换了哪些，可回放）</text>
</svg>