<svg viewBox="0 0 680 600" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8b8b8b"/>
    </marker>
  </defs>

  <text x="24" y="34" font-size="20" font-weight="700" fill="#1a1a1a">notify 依赖传播：服务变化 → 激活/停用</text>
  <text x="24" y="56" font-size="13" fill="#666">插件 B 依赖 A、C；服务一变，B 自动重查依赖、重算指纹、决定激活/停用</text>

  <rect x="180" y="76" width="320" height="56" rx="10" fill="#e3f0ff" stroke="#4a7cf0" stroke-width="1.5"/>
  <text x="196" y="100" font-size="13" font-weight="700" fill="#2f5fd0">① 服务变化</text>
  <text x="196" y="120" font-size="11" fill="#555">A 被 provide（注册）或撤销（反注册）</text>

  <path d="M 340 132 L 340 154" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <rect x="180" y="158" width="320" height="56" rx="10" fill="#fff7e6" stroke="#e0a030" stroke-width="1.5"/>
  <text x="196" y="182" font-size="13" font-weight="700" fill="#b07900">② notify(['A']) 广播</text>
  <text x="196" y="202" font-size="11" fill="#555">通知所有 inject 声明了 A 的插件（且同 realm）</text>

  <path d="M 340 214 L 340 236" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <rect x="180" y="240" width="320" height="72" rx="10" fill="#eaffea" stroke="#38a83c" stroke-width="1.5"/>
  <text x="196" y="264" font-size="13" font-weight="700" fill="#1f7a22">③ B 自己重新拉取（状态同步）</text>
  <text x="196" y="284" font-size="11" fill="#555">notify 只发"通知"，B 主动重新拿 A 的最新值</text>
  <text x="196" y="302" font-size="11" fill="#555">（是"通知+自己拉"，不是把值推给 B）</text>

  <path d="M 340 312 L 340 334" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <rect x="180" y="338" width="320" height="72" rx="10" fill="#f3efff" stroke="#8a6cf0" stroke-width="1.5"/>
  <text x="196" y="362" font-size="13" font-weight="700" fill="#5f3fd0">④ _checkImpl + _refresh 重算指纹</text>
  <text x="196" y="382" font-size="11" fill="#555">A 还在？→ 存/删缓存；然后算 epoch（uid 拼接）</text>
  <text x="196" y="400" font-size="11" fill="#555">依赖齐 = ":uidA:uidC"；缺一个 = "__INACTIVE__"</text>

  <path d="M 340 410 L 340 432" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <rect x="140" y="436" width="400" height="72" rx="10" fill="#ffe9e9" stroke="#d04a4a" stroke-width="2"/>
  <text x="156" y="460" font-size="13" font-weight="700" fill="#b02a2a">⑤ 指纹变了 → 激活 / 停用</text>
  <text x="156" y="480" font-size="11" fill="#555">从"缺"变"齐" → _reload（激活）；从"齐"变"缺" → _unload（停用）</text>
  <text x="156" y="498" font-size="11" fill="#555">指纹没变 → 什么都不做</text>

  <rect x="24" y="528" width="632" height="56" rx="10" fill="#f6f6f6" stroke="#ddd"/>
  <text x="40" y="550" font-size="12" font-weight="700" fill="#333">指纹例子（B 依赖 A、C）</text>
  <text x="40" y="570" font-size="11" fill="#555">A=provider uid 5、C=provider uid 9 → 齐：":5:9" · A 撤销："__INACTIVE__" · A 换实现(uid 12)：":12:9"</text>
</svg>