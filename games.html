  <div class="cyber-scanline"></div>
  <div class="cyber-glow glow-red"></div>
  <div class="cyber-glow glow-cyan"></div>

</div>

<!-- ===== 导航 ===== -->

<!-- ===== 游戏列表 ===== -->
<main class="main">
  <section class="section" id="games">
    <div class="section-head">
      <div class="section-title-wrap">
        <h2 class="section-title"><span class="section-mark">//</span> 小游戏 <span class="section-caret">_</span></h2>
      </div>
      <p class="section-desc">学习累了，来玩一局</p>
    </div>
    <div class="games-grid">
      <a class="game-card g-snake" href="game-snake.html">
        <canvas class="game-preview" id="preview-snake"></canvas>
        <span class="game-num">01</span>
        <h3 class="game-name">贪吃蛇</h3>
        <p class="game-desc">经典贪吃蛇，方向键 / WASD 控制，吃食物变长</p>
        <span class="game-play">开始游戏 →</span>
      </a>
      <a class="game-card g-runner" href="game-runner.html">
        <canvas class="game-preview" id="preview-runner"></canvas>
        <span class="game-num">02</span>
        <h3 class="game-name">赛博跑酷</h3>
        <p class="game-desc">空格跳跃躲避障碍，速度越来越快，障碍越来越难</p>
        <span class="game-play">开始游戏 →</span>
      </a>
      <a class="game-card g-2048" href="game-2048.html">
        <canvas class="game-preview" id="preview-2048"></canvas>
        <span class="game-num">03</span>
        <h3 class="game-name">2048</h3>
        <p class="game-desc">方向键合并数字，挑战 2048</p>
        <span class="game-play">开始游戏 →</span>
      </a>
    </div>
  </section>
</main>

<footer class="footer">
  <p>睡与吃 // SLEEP AND EAT</p>
</footer>
