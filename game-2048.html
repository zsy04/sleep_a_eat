<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>2048 · 睡与吃</title>
<script>(function(){try{if(localStorage.getItem("sy-theme")==="light")document.documentElement.setAttribute("data-theme","light");}catch(e){}})();</script>
<link rel="stylesheet" href="css/styles.css" />
<link rel="stylesheet" href="css/games.css" />
</head>
<body data-page="games" class="game-page">

<div class="cyber-bg" aria-hidden="true">
  <div class="cyber-grid"></div>
  <div class="cyber-scanline"></div>
  <div class="cyber-glow glow-red"></div>
  <div class="cyber-glow glow-cyan"></div>
  <canvas id="particle-canvas"></canvas>
</div>

<nav class="nav" id="nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">
      <span class="logo-bracket">[</span>
      <span class="logo-text">睡与吃</span>
      <span class="logo-cursor">_</span>
      <span class="logo-bracket">]</span>
    </a>
    <div class="nav-links">
      <a href="index.html" class="nav-link" data-nav="home">首页</a>
      <a href="notes.html" class="nav-link" data-nav="notes">笔记库</a>
      <a href="essays.html" class="nav-link" data-nav="essays">随笔</a>
      <a href="games.html" class="nav-link" data-nav="games">小游戏</a>
      <a href="about.html" class="nav-link" data-nav="about">关于</a>
    </div>
      <button class="theme-toggle" data-theme-toggle aria-label="切换主题">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
    <button class="nav-toggle" id="navToggle" aria-label="菜单">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<main class="game-wrap">
  <div class="game-frame">
    <div class="game-hud">
      <div class="game-score">SCORE <b id="score">0</b></div>
      <div class="game-score">BEST <b id="best">0</b></div>
      <div class="game-controls">
        <button class="primary" id="btnNew">新游戏</button>
      </div>
    </div>
    <div class="game-arena">
      <div id="board2048"></div>
      <div class="game-over" id="gameOver">
        <div class="game-over-title">GAME OVER</div>
        <div class="game-over-score">得分 <b id="finalScore">0</b></div>
        <div class="game-controls">
          <button class="primary" id="btnRestart">再来一局</button>
          <button id="btnBack">返回游戏列表</button>
        </div>
      </div>
    </div>
    <p class="game-tips">方向键 / WASD 移动 · 相同数字合并 · 冲击 2048</p>
    <div class="game-back">
      <a href="games.html" class="btn btn-ghost">← 返回游戏列表</a>
    </div>
  </div>
</main>

<footer class="footer">
  <p>睡与吃 // SLEEP AND EAT</p>
</footer>

<script src="js/game-2048.js"></script>
<script src="js/theme.js"></script>
</body>
</html>
