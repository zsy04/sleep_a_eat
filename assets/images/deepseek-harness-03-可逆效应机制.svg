<svg viewBox="0 0 680 230" width="100%" xmlns="http://www.w3.org/2000/svg">
<title>可逆效应的 track / recover 机制</title>
<desc>三个上下文状态经效应 f1、f2 依次变换，逆函数 g1、g2 按相反顺序累积进累加器 φ，recover 应用 φ 恢复初始状态。</desc>
<defs>
<marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="40" y="42" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">可逆效应：track 追踪 · recover 恢复</text>
<g>
<rect x="40" y="60" width="150" height="56" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="115" y="84" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">状态 γ0</text>
<text x="115" y="102" font-family="system-ui, sans-serif" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">初始上下文</text>
</g>
<g>
<rect x="265" y="60" width="150" height="56" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="84" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">状态 γ1</text>
<text x="340" y="102" font-family="system-ui, sans-serif" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">应用 f1 后</text>
</g>
<g>
<rect x="490" y="60" width="150" height="56" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="565" y="84" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">状态 γ2</text>
<text x="565" y="102" font-family="system-ui, sans-serif" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">应用 f2 后</text>
</g>
<path d="M190 88 L263 88" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow3)"/>
<text x="226" y="76" font-family="system-ui, sans-serif" font-size="12" fill="#185FA5" text-anchor="middle">f1</text>
<text x="226" y="52" font-family="system-ui, sans-serif" font-size="12" fill="#5F5E5A" text-anchor="middle">g1</text>
<path d="M415 88 L488 88" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow3)"/>
<text x="451" y="76" font-family="system-ui, sans-serif" font-size="12" fill="#185FA5" text-anchor="middle">f2</text>
<text x="451" y="52" font-family="system-ui, sans-serif" font-size="12" fill="#5F5E5A" text-anchor="middle">g2</text>
<text x="40" y="150" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#0F6E56">accumulator φ = g1 ∘ g2　—— 逆按相反顺序累积，天然 LIFO</text>
<path d="M565 116 C565 196, 115 196, 115 116" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow3)"/>
<text x="340" y="212" font-family="system-ui, sans-serif" font-size="13" fill="#0F6E56" text-anchor="middle">recover：φ(γ2) = g1(g2(γ2)) = γ0　—— 卸载组件 = 应用累积的逆</text>
</svg>
