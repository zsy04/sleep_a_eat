<svg viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8b8b8b"/>
    </marker>
  </defs>

  <text x="24" y="34" font-size="20" font-weight="700" fill="#1a1a1a">KV cache 复用：前缀一致，缓存白嫖</text>
  <text x="24" y="56" font-size="13" fill="#666">压缩指令放"最后一条消息"，让压缩请求成为真实请求的"前缀"</text>

  <text x="24" y="92" font-size="13" font-weight="700" fill="#1a1a1a">真实请求（之前发过的，KV 已算好）</text>
  <rect x="24" y="102" width="180" height="40" rx="6" fill="#e3f0ff" stroke="#4a7cf0"/>
  <text x="114" y="126" font-size="12" fill="#2f5fd0" text-anchor="middle">system prompt</text>
  <rect x="212" y="102" width="250" height="40" rx="6" fill="#e3f0ff" stroke="#4a7cf0"/>
  <text x="337" y="126" font-size="12" fill="#2f5fd0" text-anchor="middle">历史消息 msg1~msg40（原文）</text>
  <rect x="470" y="102" width="160" height="40" rx="6" fill="#d5f5d5" stroke="#38a83c"/>
  <text x="550" y="126" font-size="12" fill="#1f7a22" text-anchor="middle">[最新消息]</text>

  <path d="M 114 160 L 114 180" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 337 160 L 337 180" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="24" y="198" font-size="13" font-weight="700" fill="#1a1a1a">压缩请求（做压缩时的调用）</text>
  <rect x="24" y="208" width="180" height="40" rx="6" fill="#e3f0ff" stroke="#4a7cf0"/>
  <text x="114" y="232" font-size="12" fill="#2f5fd0" text-anchor="middle">system prompt</text>
  <rect x="212" y="208" width="250" height="40" rx="6" fill="#e3f0ff" stroke="#4a7cf0"/>
  <text x="337" y="232" font-size="12" fill="#2f5fd0" text-anchor="middle">历史消息 msg1~msg40（原文）</text>
  <rect x="470" y="208" width="160" height="40" rx="6" fill="#ffe9a8" stroke="#e0a030"/>
  <text x="550" y="232" font-size="12" fill="#b07900" text-anchor="middle">[压缩指令]</text>

  <rect x="24" y="268" width="438" height="40" rx="6" fill="none" stroke="#38a83c" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="243" y="292" font-size="12" font-weight="700" fill="#1f7a22" text-anchor="middle">← 前缀逐 token 一致 → KV 直接复用，不重算</text>

  <rect x="470" y="268" width="160" height="40" rx="6" fill="none" stroke="#e0a030" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="550" y="292" font-size="12" font-weight="700" fill="#b07900" text-anchor="middle">只算这一句</text>

  <rect x="24" y="330" width="632" height="88" rx="8" fill="#fff5f5" stroke="#d04a4a" stroke-width="1.5"/>
  <text x="40" y="352" font-size="13" font-weight="700" fill="#b02a2a">❌ 错误做法：压缩指令塞进 system prompt 开头</text>
  <text x="40" y="372" font-size="12" fill="#555">[压缩指令] [system] [历史...] → 第一个 token 就变了，KV cache 从头全部作废</text>
  <text x="40" y="392" font-size="12" fill="#555">✅ 正确：指令放最后 → 前缀不动 → 缓存复用，只算新增指令那点 token</text>
</svg>