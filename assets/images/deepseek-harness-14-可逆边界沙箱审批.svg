<svg viewBox="0 0 680 400" width="100%" xmlns="http://www.w3.org/2000/svg">
<title>可逆效应边界的落地：沙箱三档 + 审批升级</title>
<desc>沙箱三档从窄到宽：read-only、workspace-write、danger-full-access；升级需审批加理由；界内 ctx.effect 可逆，界外操作被沙箱和审批挡住。</desc>
<defs>
<marker id="arrowb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="40" y="40" font-family="system-ui, sans-serif" font-size="15" font-weight="500" fill="#2C2C2A">可逆效应边界的落地：沙箱三档 + 审批升级</text>
<g>
<rect x="40" y="56" width="180" height="64" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="130" y="80" font-family="Consolas, monospace" font-size="12" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">read-only</text>
<text x="130" y="100" font-family="system-ui, sans-serif" font-size="11" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">边界最窄 · 只能读</text>
</g>
<g>
<rect x="250" y="56" width="180" height="64" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="80" font-family="Consolas, monospace" font-size="12" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">workspace-write</text>
<text x="340" y="100" font-family="system-ui, sans-serif" font-size="11" fill="#0F6E56" text-anchor="middle" dominant-baseline="231" dominant-baseline="central">边界放宽 · 可写工作区</text>
</g>
<g>
<rect x="460" y="56" width="180" height="64" rx="10" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="550" y="80" font-family="Consolas, monospace" font-size="12" font-weight="500" fill="#791F1F" text-anchor="middle" dominant-baseline="central">danger-full-access</text>
<text x="550" y="100" font-family="system-ui, sans-serif" font-size="11" fill="#A32D2D" text-anchor="middle" dominant-baseline="central">边界最宽 · 完全访问</text>
</g>
<path d="M220 88 L248 88" fill="none" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrowb)"/>
<path d="M430 88 L458 88" fill="none" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrowb)"/>
<text x="234" y="74" font-family="system-ui, sans-serif" font-size="11" fill="#854F0B" text-anchor="middle">审批</text>
<text x="444" y="74" font-family="system-ui, sans-serif" font-size="11" fill="#854F0B" text-anchor="middle">审批</text>
<text x="340" y="146" font-family="system-ui, sans-serif" font-size="12" fill="#854F0B" text-anchor="middle">升级需 sandbox_permissions + justification（理由），走 approval</text>
<g>
<rect x="40" y="176" width="600" height="90" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="56" y="196" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#2C2C2A" dominant-baseline="central">界内 vs 界外</text>
<text x="56" y="218" font-family="system-ui, sans-serif" font-size="12" fill="#0F6E56" dominant-baseline="central">界内：ctx.effect 追踪 + 回滚（可逆）</text>
<text x="56" y="240" font-family="system-ui, sans-serif" font-size="12" fill="#A32D2D" dominant-baseline="central">界外：写文件 / 发请求 / 执行命令（发射，不可逆）→ 沙箱挡 + 审批扣留</text>
</g>
<g>
<rect x="40" y="286" width="600" height="90" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="56" y="306" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#0C447C" dominant-baseline="central">审批策略 ApprovalPolicy</text>
<text x="56" y="328" font-family="system-ui, sans-serif" font-size="12" fill="#185FA5" dominant-baseline="321" dominant-baseline="central">ask（默认）：问用户，批了才发射；无 answerer 则 fail closed</text>
<text x="56" y="350" font-family="system-ui, sans-serif" font-size="12" fill="#185FA5" dominant-baseline="central">never：确定性拒绝（子 agent 默认，因已在沙箱内）</text>
</g>
</svg>
