<svg viewBox="0 0 680 400" width="100%" xmlns="http://www.w3.org/2000/svg">
<title>agent-loop 输入侧：inbox 与上下文注入</title>
<desc>followup/steer/inject/send 四种输入进入 inbox；wakeup=true 立即唤醒，inject（wakeup=false）只塞上下文不唤醒，等下次唤醒一起认领。</desc>
<defs>
<marker id="arrowi" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="40" y="40" font-family="system-ui, sans-serif" font-size="15" font-weight="500" fill="#2C2C2A">agent-loop 输入侧：inbox 与上下文注入</text>
<g>
<rect x="40" y="56" width="136" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="108" y="78" font-family="Consolas, monospace" font-size="12" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">followup</text>
<text x="108" y="96" font-family="system-ui, sans-serif" font-size="11" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">唤醒 · 新一轮</text>
</g>
<g>
<rect x="192" y="56" width="136" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="260" y="78" font-family="Consolas, monospace" font-size="12" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">steer</text>
<text x="260" y="96" font-family="system-ui, sans-serif" font-size="11" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">唤醒 · 当前轮下一步</text>
</g>
<g>
<rect x="344" y="56" width="136" height="56" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="412" y="78" font-family="Consolas, monospace" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">inject</text>
<text x="412" y="96" font-family="system-ui, sans-serif" font-size="11" fill="#185FA5" text-anchor="middle" dominant-baseline="central">不唤醒 · 塞上下文</text>
</g>
<g>
<rect x="496" y="56" width="136" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="564" y="78" font-family="Consolas, monospace" font-size="12" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">send</text>
<text x="564" y="96" font-family="system-ui, sans-serif" font-size="11" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">通用</text>
</g>
<path d="M108 112 L320 168" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrowi)"/>
<path d="M260 112 L320 168" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrowi)"/>
<path d="M412 112 L360 168" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrowi)"/>
<path d="M564 112 L360 168" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrowi)"/>
<g>
<rect x="220" y="170" width="240" height="72" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="196" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">inbox 收件箱</text>
<text x="340" y="218" font-family="system-ui, sans-serif" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">inserted / claimed / discarded</text>
</g>
<path d="M340 242 L340 266" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrowi)"/>
<text x="356" y="256" font-family="system-ui, sans-serif" font-size="11" fill="#5F5E5A">唤醒（wakeup=true）</text>
<g>
<rect x="220" y="268" width="240" height="52" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="288" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">wakeDriver → kick()</text>
<text x="340" y="306" font-family="system-ui, sans-serif" font-size="11" fill="#185FA5" text-anchor="middle" dominant-baseline="central">启动 turn 循环（忙则 latch 锁存）</text>
</g>
<text x="340" y="356" font-family="system-ui, sans-serif" font-size="12" fill="#0F6E56" text-anchor="middle">inject 注入的内容不唤醒：安静躺在 inbox，等下次唤醒一起被 claim</text>
<text x="340" y="376" font-family="system-ui, sans-serif" font-size="12" fill="#5F5E5A" text-anchor="middle">「Some messages wake it immediately; injected context waits in the inbox.」</text>
</svg>
