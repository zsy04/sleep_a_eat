<svg viewBox="0 0 680 460" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <text x="24" y="34" font-size="20" font-weight="700" fill="#1a1a1a">selectCompactableRange：从后往前累加，留尾巴压前边</text>
  <text x="24" y="56" font-size="13" fill="#666">retainTokens = 要保留的"最近尾巴"token 预算</text>

  <text x="40" y="100" font-size="12" fill="#888">最早</text>
  <text x="600" y="100" font-size="12" fill="#888">最新</text>

  <rect x="40" y="112" width="360" height="46" rx="8" fill="#ffe9e9" stroke="#d04a4a" stroke-width="1.5"/>
  <text x="220" y="140" font-size="13" font-weight="700" fill="#b02a2a" text-anchor="middle">压缩范围（较早历史）msg1~msg40</text>

  <rect x="400" y="112" width="240" height="46" rx="8" fill="#eaffea" stroke="#38a83c" stroke-width="1.5"/>
  <text x="520" y="140" font-size="13" font-weight="700" fill="#1f7a22" text-anchor="middle">保留尾巴 msg41~msg50</text>

  <line x1="400" y1="108" x2="400" y2="162" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="400" y="180" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">切点</text>

  <path d="M 560 200 L 100 200" stroke="#c0392b" stroke-width="2.5" fill="none" marker-end="url(#arrR)"/>
  <text x="330" y="194" font-size="13" font-weight="700" fill="#c0392b" text-anchor="middle">① 从最新往前累加 token，凑满 retainTokens 就停</text>

  <rect x="40" y="222" width="600" height="56" rx="8" fill="#fff7e6" stroke="#e0a030" stroke-width="1.5"/>
  <text x="56" y="246" font-size="13" font-weight="700" fill="#b07900">② 切点若切断 tool-call / tool-result 配对，就往前挪到平衡点</text>
  <text x="56" y="266" font-size="12" fill="#555">例：msg40 发出 tool-call、msg41 才返回结果 → 切点从 msg40 往前挪到 msg39</text>

  <rect x="40" y="300" width="600" height="60" rx="8" fill="#f6f6f6" stroke="#ddd"/>
  <text x="56" y="324" font-size="13" font-weight="700" fill="#333">结果</text>
  <text x="56" y="344" font-size="12" fill="#555">切点之前（msg1~msg39）→ 交给 LLM 压成摘要；切点之后（msg40~msg50）→ 原样保留</text>

  <text x="40" y="396" font-size="12" fill="#666">压缩最早的、留足最近的，且绝不在半截工具调用处下刀</text>
</svg>