<svg viewBox="0 0 680 560" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <text x="24" y="34" font-size="20" font-weight="700" fill="#1a1a1a">事件系统：五种分发模式对比</text>
  <text x="24" y="56" font-size="13" fill="#666">区分就看两个问题：一起跑还是排队？返回值要不要、怎么用？</text>

  <rect x="24" y="76" width="632" height="60" rx="8" fill="#eef4ff" stroke="#4a7cf0" stroke-width="1.5"/>
  <text x="40" y="100" font-size="15" font-weight="700" fill="#2f5fd0">emit（广播）</text>
  <text x="40" y="120" font-size="12" fill="#555">一起跑（同步）、不等 Promise、忽略返回值 —— "喊一嗓子，走人"</text>

  <rect x="24" y="144" width="632" height="60" rx="8" fill="#eef4ff" stroke="#4a7cf0" stroke-width="1.5"/>
  <text x="40" y="168" font-size="15" font-weight="700" fill="#2f5fd0">parallel（并发）</text>
  <text x="40" y="188" font-size="12" fill="#555">一起跑（并发）、等全部 settle、收集错误（AggregateError）—— "群发任务，等交卷"</text>

  <rect x="24" y="212" width="632" height="60" rx="8" fill="#fff7e6" stroke="#e0a030" stroke-width="1.5"/>
  <text x="40" y="236" font-size="15" font-weight="700" fill="#b07900">serial（串行）</text>
  <text x="40" y="256" font-size="12" fill="#555">排队、逐个 await、遇 bail 停、返回第一个 bail 值 —— "排队问，谁点头停谁"</text>

  <rect x="24" y="280" width="632" height="60" rx="8" fill="#fff7e6" stroke="#e0a030" stroke-width="1.5"/>
  <text x="40" y="304" font-size="15" font-weight="700" fill="#b07900">bail（串行同步）</text>
  <text x="40" y="324" font-size="12" fill="#555">排队、不 await、遇 bail 停 —— "serial 的同步版"</text>

  <rect x="24" y="348" width="632" height="60" rx="8" fill="#eaffea" stroke="#38a83c" stroke-width="1.5"/>
  <text x="40" y="372" font-size="15" font-weight="700" fill="#1f7a22">waterfall（洋葱/中间件）</text>
  <text x="40" y="392" font-size="12" fill="#555">层层套、next() 续延、返回最外层 —— "中间件，可改可拦"（详见洋葱图）</text>

  <rect x="24" y="432" width="632" height="96" rx="10" fill="#f6f6f6" stroke="#ddd"/>
  <text x="40" y="456" font-size="13" font-weight="700" fill="#333">怎么选？看"要不要给插件干预机会"</text>
  <text x="40" y="478" font-size="12" fill="#555">纯通知、不关心结果 → emit / parallel</text>
  <text x="40" y="498" font-size="12" fill="#555">"谁先给答案谁终结" → serial / bail</text>
  <text x="40" y="518" font-size="12" fill="#555">"层层拦截 / 改写 / 放行" → waterfall</text>
</svg>