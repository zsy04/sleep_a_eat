<svg viewBox="0 0 680 414" width="100%" xmlns="http://www.w3.org/2000/svg">
<title>顺序机制：分层组合与覆盖</title>
<desc>dsh 启动时自下而上分层：先按 profile 声明顺序加载 bundle，再依次应用 profile patch、home patch、命令行 patch，上层覆盖下层，最终注册进 ctx。</desc>
<defs>
<marker id="arrowx" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="40" y="42" font-family="system-ui, sans-serif" font-size="15" font-weight="500" fill="#2C2C2A">顺序机制：分层组合 + 覆盖</text>
<g>
<rect x="40" y="56" width="600" height="42" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="56" y="81" font-family="system-ui, sans-serif" font-size="13" fill="#854F0B" dominant-baseline="central">--patch 命令行覆盖　·　最后应用，优先级最高</text>
</g>
<g>
<rect x="40" y="110" width="600" height="42" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="56" y="135" font-family="system-ui, sans-serif" font-size="13" fill="#854F0B" dominant-baseline="central">home 级全局 patch</text>
</g>
<g>
<rect x="40" y="164" width="600" height="42" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="56" y="189" font-family="system-ui, sans-serif" font-size="13" fill="#854F0B" dominant-baseline="central">profile 的 cordis.patch.yml</text>
</g>
<g>
<rect x="40" y="218" width="600" height="84" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="56" y="238" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#0C447C" dominant-baseline="central">第 1 层：profile 里列出的 bundle（按声明顺序）</text>
<rect x="56" y="256" width="200" height="36" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="156" y="274" font-family="system-ui, sans-serif" font-size="12" fill="#0C447C" text-anchor="middle" dominant-baseline="central">dsh-base（第 1 个）</text>
<rect x="340" y="256" width="200" height="36" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="440" y="274" font-family="system-ui, sans-serif" font-size="12" fill="#0C447C" text-anchor="middle" dominant-baseline="central">dsh-web-app（第 2 个）</text>
<path d="M256 274 L338 274" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrowx)"/>
</g>
<path d="M64 218 L64 206" fill="none" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrowx)"/>
<path d="M64 164 L64 152" fill="none" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrowx)"/>
<path d="M64 110 L64 98" fill="none" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrowx)"/>
<g>
<rect x="40" y="322" width="600" height="52" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="56" y="352" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#085041" dominant-baseline="central">最终插件树：全部注册进 ctx</text>
</g>
<text x="340" y="396" font-family="system-ui, sans-serif" font-size="12" fill="#5F5E5A" text-anchor="middle">应用顺序：自下而上，上层覆盖下层（第 4 层优先级最高）</text>
</svg>
