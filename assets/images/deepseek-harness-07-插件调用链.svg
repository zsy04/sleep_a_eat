<svg viewBox="0 0 680 640" width="100%" xmlns="http://www.w3.org/2000/svg">
<title>Cordis 插件调用链（真实函数名）</title>
<desc>从 profile 清单经 registry.plugin 创建 Fiber 并解析依赖，进入 apply(ctx)；apply 内 ctx.provide/on/set/get 都归结到 fiber.effect；卸载时 fiber.dispose 逆序回滚。</desc>
<defs>
<marker id="arrowc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="40" y="42" font-family="system-ui, sans-serif" font-size="15" font-weight="500" fill="#2C2C2A">Cordis 插件调用链（真实函数名）</text>
<g>
<rect x="160" y="58" width="360" height="52" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="80" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">profile 清单</text>
<text x="340" y="98" font-family="system-ui, sans-serif" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">cordis.yml 按序列出 bundle</text>
</g>
<path d="M340 110 L340 144" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrowc)"/>
<g>
<rect x="160" y="146" width="360" height="48" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="170" font-family="Consolas, monospace" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">registry.plugin(plugin, config)</text>
</g>
<path d="M340 194 L340 224" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrowc)"/>
<g>
<rect x="160" y="226" width="360" height="48" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="250" font-family="Consolas, monospace" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">new Fiber(ctx, config, Inject.resolve(inject))</text>
</g>
<path d="M340 274 L340 304" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrowc)"/>
<g>
<rect x="160" y="306" width="360" height="48" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="330" font-family="Consolas, monospace" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">plugin.apply(ctx)</text>
</g>
<path d="M340 354 L340 384" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrowc)"/>
<g>
<rect x="60" y="386" width="560" height="150" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="76" y="404" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">apply(ctx) 内部：注册都归结到 ctx.fiber.effect(execute)</text>
<rect x="76" y="414" width="260" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="206" y="430" font-family="Consolas, monospace" font-size="12" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">ctx.provide(name, value)</text>
<text x="206" y="448" font-family="system-ui, sans-serif" font-size="11" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">提供服务 · 返回 disposer</text>
<rect x="344" y="414" width="260" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="474" y="430" font-family="Consolas, monospace" font-size="12" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">ctx.on(name, listener)</text>
<text x="474" y="448" font-family="system-ui, sans-serif" font-size="11" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">挂事件 · 返回 disposer</text>
<rect x="76" y="468" width="260" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="206" y="484" font-family="Consolas, monospace" font-size="12" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">ctx.set(name, value)</text>
<text x="206" y="502" font-family="system-ui, sans-serif" font-size="11" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">注册服务 · 返回 disposer</text>
<rect x="344" y="468" width="260" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="474" y="484" font-family="Consolas, monospace" font-size="12" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">ctx.get(name)</text>
<text x="474" y="502" font-family="system-ui, sans-serif" font-size="11" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">消费依赖（读）</text>
</g>
<path d="M340 536 L340 566" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrowc)"/>
<g>
<rect x="160" y="568" width="360" height="52" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="590" font-family="Consolas, monospace" font-size="13" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">fiber.dispose()</text>
<text x="340" y="608" font-family="system-ui, sans-serif" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">disposables.reverse() → 逆序回滚</text>
</g>
</svg>
