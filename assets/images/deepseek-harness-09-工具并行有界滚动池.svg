<g><rect x="402" y="180" width="92" height="40" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/><text x="448" y="194" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#04342C" text-anchor="middle">tool4</text><text x="448" y="210" font-family="system-ui, sans-serif" font-size="11" fill="#04342C" text-anchor="middle">运行</text></g>
<g><rect x="506" y="180" width="92" height="40" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/><text x="552" y="194" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#04342C" text-anchor="middle">tool5</text><text x="552" y="210" font-family="system-ui, sans-serif" font-size="11" fill="#04342C" text-anchor="middle">运行</text></g>
<text x="40" y="250" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#0F6E56">关键：结果按「模型顺序」1 → 2 → 3 → 4 → 5 提交（保序），而不是按谁先完成谁先提交</text>
<text x="40" y="272" font-family="system-ui, sans-serif" font-size="12" fill="#5F5E5A">例如 t1 时刻 tool2 先完成，但要等 tool1 也提交后，tool2 的结果才落进 session log</text>
</svg>
