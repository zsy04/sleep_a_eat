<svg viewBox="0 0 680 300" width="100%" xmlns="http://www.w3.org/2000/svg">
<title>工具并行执行：有界滚动池</title>
<desc>5 个工具调用，并发上限 3：池满不启动新调用，有空槽补下一个；结果按模型顺序 1 到 5 提交，而非完成顺序。</desc>
<text x="40" y="40" font-family="system-ui, sans-serif" font-size="15" font-weight="500" fill="#2C2C2A">工具并行：有界滚动池（并发上限 maxParallelToolCalls = 3）</text>
<g>
<rect x="40" y="54" width="12" height="12" rx="3" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text x="58" y="64" font-family="system-ui, sans-serif" font-size="12" fill="#2C2C2A">运行中</text>
<rect x="130" y="54" width="12" height="12" rx="3" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="148" y="64" font-family="system-ui, sans-serif" font-size="12" fill="#2C2C2A">完成</text>
<rect x="210" y="54" width="12" height="12" rx="3" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="2 2"/>
<text x="228" y="64" font-family="system-ui, sans-serif" font-size="12" fill="#2C2C2A">等待</text>
</g>
<text x="40" y="92" font-family="system-ui, sans-serif" font-size="12" fill="#5F5E5A">t0</text>
<g><rect x="90" y="76" width="92" height="40" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/><text x="136" y="90" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#04342C" text-anchor="middle">tool1</text><text x="136" y="106" font-family="system-ui, sans-serif" font-size="11" fill="#04342C" text-anchor="middle">运行</text></g>
<g><rect x="194" y="76" width="92" height="40" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/><text x="240" y="90" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#04342C" text-anchor="middle">tool2</text><text x="240" y="106" font-family="system-ui, sans-serif" font-size="11" fill="#04342C" text-anchor="middle">运行</text></g>
<g><rect x="298" y="76" width="92" height="40" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/><text x="344" y="90" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#04342C" text-anchor="middle">tool3</text><text x="344" y="106" font-family="system-ui, sans-serif" font-size="11" fill="#04342C" text-anchor="middle">运行</text></g>
