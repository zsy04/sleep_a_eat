<g><rect x="90" y="180" width="92" height="40" rx="8" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/><text x="136" y="194" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle">tool1</text><text x="136" y="210" font-family="system-ui, sans-serif" font-size="11" fill="#2C2C2A" text-anchor="middle">完成</text></g>
