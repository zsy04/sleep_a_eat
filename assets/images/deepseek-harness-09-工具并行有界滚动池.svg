<g><rect x="402" y="128" width="92" height="40" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/><text x="448" y="142" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#04342C" text-anchor="middle">tool4</text><text x="448" y="158" font-family="system-ui, sans-serif" font-size="11" fill="#04342C" text-anchor="middle">运行</text></g>
<g><rect x="506" y="128" width="92" height="40" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="2 2"/><text x="552" y="142" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#888780" text-anchor="middle">tool5</text><text x="552" y="158" font-family="system-ui, sans-serif" font-size="11" fill="#888780" text-anchor="middle">等待</text></g>
