<svg viewBox="0 0 680 412" width="100%" xmlns="http://www.w3.org/2000/svg">
<title>以 ctx 为核心的插件化模型</title>
<desc>上下文 ctx 是中枢，插件通过 effect 注册挂载贡献，通过 coeffect 依赖获取服务，卸载时逆序回滚。</desc>
<defs>
<marker id="arrh" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="40" y="42" font-family="system-ui, sans-serif" font-size="15" font-weight="500" fill="#2C2C2A">以 ctx 为核心：插件经由上下文互相解耦</text>
<g>
<rect x="260" y="56" width="160" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="80" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">模型适配器</text>
<text x="340" y="98" font-family="system-ui, sans-serif" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">llm adapter</text>
</g>
<g>
<rect x="486" y="168" width="150" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="561" y="192" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">工具注册</text>
<text x="561" y="210" font-family="system-ui, sans-serif" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">tools</text>
</g>
<g>
<rect x="260" y="292" width="160" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="316" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">会话日志</text>
<text x="340" y="334" font-family="system-ui, sans-serif" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">session</text>
</g>
<g>
<rect x="44" y="168" width="150" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="119" y="192" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">agent-loop</text>
<text x="119" y="210" font-family="system-ui, sans-serif" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">核心循环</text>
</g>
<g>
<rect x="250" y="152" width="180" height="104" rx="16" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="186" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">ctx 上下文</text>
<text x="340" y="208" font-family="system-ui, sans-serif" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">注册中心</text>
<text x="340" y="226" font-family="system-ui, sans-serif" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">依赖解析 + 生命周期</text>
</g>
<path d="M340 112 L340 150" fill="none" stroke="#888780" stroke-width="1.5" marker-start="url(#arrh)" marker-end="url(#arrh)"/>
<path d="M430 196 L484 196" fill="none" stroke="#888780" stroke-width="1.5" marker-start="url(#arrh)" marker-end="url(#arrh)"/>
<path d="M340 256 L340 290" fill="none" stroke="#888780" stroke-width="1.5" marker-start="url(#arrh)" marker-end="url(#arrh)"/>
<path d="M194 196 L248 196" fill="none" stroke="#888780" stroke-width="1.5" marker-start="url(#arrh)" marker-end="url(#arrh)"/>
<text x="340" y="372" font-family="system-ui, sans-serif" font-size="12" fill="#185FA5" text-anchor="middle">插件 → ctx：effect 注册（ctx.on / ctx.set / ctx.provide），每次注册返回 disposer</text>
<text x="340" y="392" font-family="system-ui, sans-serif" font-size="12" fill="#0F6E56" text-anchor="middle">ctx → 插件：coeffect 依赖（ctx.get），依赖就绪才激活 · 卸载时逆序回滚</text>
</svg>
